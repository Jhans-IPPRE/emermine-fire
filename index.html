<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>EmerMine Fire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --red:#b91c1c; --red2:#dc2626; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7;
  --bad:#b91c1c; --badbg:#fee2e2; --info:#1d4ed8; --infobg:#dbeafe; --gray:#4b5563; --graybg:#e5e7eb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--info)}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px;cursor:pointer}
.net{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap;cursor:pointer;border:0;color:#fff}
.net.off{background:#111827}
main{max-width:860px;margin:0 auto;padding:12px 12px 90px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:11px}
nav.tabs a b{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--red);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:12px;border-left:4px solid var(--line);cursor:pointer}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.kpi.ok{border-color:var(--ok)}.kpi.bad{border-color:var(--bad)}.kpi.warn{border-color:var(--warn)}.kpi.info{border-color:var(--info)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--red);padding:8px 10px;min-height:auto}
.btn.dark{background:#111827}
.btn.sm{padding:7px 11px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;min-height:44px}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #fca5a5;border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-p{background:var(--warnbg);color:var(--warn)}.b-v{background:var(--badbg);color:var(--bad)}
.b-i{background:var(--infobg);color:var(--info)}.b-g{background:var(--graybg);color:var(--gray)}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.d-ok{background:var(--ok)}.d-p{background:#f59e0b}.d-v{background:var(--bad)}.d-g{background:#9ca3af}
.sub{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
.tright{text-align:right}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk .q{flex:1}
.seg{display:flex;border:1px solid #d1d5db;border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 11px;min-width:46px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid #d1d5db}
.seg button.on.c{background:var(--ok);color:#fff}.seg button.on.nc{background:var(--bad);color:#fff}.seg button.on.na{background:#6b7280;color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:10px;z-index:99;max-width:92vw;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:16px}}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f9fafb}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.login{max-width:380px;margin:8vh auto;padding:0 16px}
.login .logo{width:64px;height:64px;border-radius:16px;background:var(--red);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.fab{position:fixed;right:16px;bottom:78px;z-index:15;border-radius:99px;box-shadow:0 4px 14px rgba(185,28,28,.4)}
.scan video{width:100%;border-radius:12px;background:#000}
.warnbox{background:var(--warnbg);color:#78350f;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.errbox{background:var(--badbg);color:#7f1d1d;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.bar{height:8px;background:var(--graybg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================================================================
   CONFIGURACIÓN — pegue aquí la URL de su aplicación web de Apps Script
   ====================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyJPOA1PYAGsdeN_OnugP_T6C1KESrnu-7lACU8Mtrv5_nTEOEzVAxuplcb-MaTVFmU/exec';   // termina en /exec
const APP_VERSION = '1.0.0';

const CHECK_LABELS = {
  accesible:'Accesible (sin obstrucciones)', visible:'Visible', senalizado:'Señalizado',
  manometro:'Manómetro en zona verde', precinto:'Precinto de seguridad', pasador:'Pasador de seguridad',
  etiqueta:'Etiqueta legible', boquilla:'Boquilla en buen estado', manguera:'Manguera en buen estado',
  sin_corrosion:'Sin corrosión', sin_golpes:'Sin golpes ni abolladuras', soporte:'Soporte / gabinete OK',
  peso:'Peso correcto'
};
const CLASES = ['ABC','BC','AB','A','B','C','D','K'];

/* ============================ Almacenamiento local (IndexedDB) ============================ */
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('emermine', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); }); }
};

/* ============================ Estado ============================ */
const S = { session: null, data: null, queue: [], online: true, syncing: false, lastSync: null, filters: { q: '', emp: '', sem: '', est: '' } };

/* ============================ Utilidades ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const fdate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; };
function addMonths(dateStr, months) {
  if (!dateStr || months === '' || months == null || isNaN(Number(months))) return '';
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + Number(months), 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(p[2], last));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }
const cfg = k => (S.data && S.data.config && S.data.config[k]) || '';
const me = () => (S.data && S.data.user) || {};
const isAdmin = () => me().rol === 'Administrador';
const seesAll = () => me().rol === 'Administrador' || me().rol === 'Supervisor';
const empName = id => { const e = (S.data.empresas || []).find(x => x.id === id); return e ? e.nombre : '—'; };
const extById = id => (S.data.extintores || []).find(x => x.id === id);

/* ============================ API ============================ */
async function api(action, body, timeoutMs) {
  if (!API_URL || API_URL.indexOf('http') !== 0) throw new Error('La app no tiene configurada la URL del servidor (API_URL).');
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), timeoutMs || 45000);
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.session && S.session.token }, body || {})), signal: ctl.signal, redirect: 'follow' });
  } catch (e) {
    setOnline(false);
    const err = new Error('Sin conexión con el servidor.'); err.offline = true; throw err;
  } finally { clearTimeout(to); }
  setOnline(true);
  let out;
  try { out = await res.json(); } catch (e) { throw new Error('Respuesta no válida del servidor.'); }
  if (!out.ok) {
    if (String(out.error || '').indexOf('AUTH:') === 0) { await logout(true); throw new Error(out.error.slice(5).trim()); }
    throw new Error(out.error || 'Error del servidor');
  }
  return out;
}

function setOnline(v) { if (S.online !== v) { S.online = v; renderNet(); } }

/* ============================ Cola offline y sincronización ============================ */
async function saveLocal() { await DB.set('data', S.data); await DB.set('queue', S.queue); }

/** Agrega una operación a la cola, la aplica en local y trata de sincronizar. */
async function enqueue(type, payload, label) {
  const op = { opId: uuid(), type: type, payload: payload, label: label, created: new Date().toISOString(), user: me().email };
  S.queue.push(op);
  applyLocal(op);
  await saveLocal();
  renderNet();
  trySync();
  return op;
}

/** Operaciones administrativas: requieren conexión (no se encolan). */
async function onlineOp(type, payload) {
  const out = await api('sync', { ops: [{ opId: uuid(), type: type, payload: payload }] });
  const r = out.results[0];
  if (!r.ok) throw new Error(r.error);
  await refresh(true);
  return r;
}

function applyLocal(op) {
  const d = S.data, p = op.payload;
  if (!d) return;
  if (op.type === 'inspeccion.create') {
    const e = extById(p.extintor_id); if (!e) return;
    let nc = 0; (d.catalogos.checklist || []).forEach(k => { if (p[k] === 'NC') nc++; });
    const r = Object.assign({}, p, { codigo: e.codigo, empresa_id: e.empresa_id, resultado: nc ? 'No Apto' : 'Apto', _pending: true });
    delete r.foto; if (p.foto) r._foto = p.foto.data;
    d.inspecciones = (d.inspecciones || []).filter(x => x.id !== p.id).concat([r]);
    if (!e.ult_inspeccion || p.fecha > e.ult_inspeccion) e.ult_inspeccion = p.fecha;
  } else if (op.type === 'servicio.create') {
    const e = extById(p.extintor_id); if (!e) return;
    const r = Object.assign({}, p, { codigo: e.codigo, empresa_id: e.empresa_id, _pending: true }); delete r.certificado;
    if (p.tipo === 'Mantenimiento') {
      e.ult_mantenimiento = p.fecha; e.prox_mantenimiento = p.proxima_fecha || addMonths(p.fecha, cfg('MESES_MANTENIMIENTO'));
      if (p.incluye_recarga === 'SI') { e.ult_recarga = p.fecha; e.prox_recarga = addMonths(p.fecha, cfg('MESES_RECARGA')); }
    } else if (p.tipo === 'Recarga') { e.ult_recarga = p.fecha; e.prox_recarga = p.proxima_fecha || addMonths(p.fecha, cfg('MESES_RECARGA')); }
    else if (p.tipo === 'Prueba Hidrostática') { e.ult_ph = p.fecha; e.prox_ph = p.proxima_fecha || addMonths(p.fecha, 12 * phYears(e.agente)); }
    d.servicios = (d.servicios || []).filter(x => x.id !== p.id).concat([r]);
  } else if (op.type === 'extintor.save') {
    const e = extById(p.id);
    const r = Object.assign({}, p, { _pending: true }); if (p.foto) r._foto = p.foto.data; delete r.foto;
    if (!r.prox_ph && !(e && e.prox_ph) && r.fecha_fabricacion) r.prox_ph = addMonths(r.fecha_fabricacion, 12 * phYears(r.agente));
    if (e) Object.assign(e, r); else d.extintores.unshift(Object.assign({ estado: 'Operativo', creado: new Date().toISOString() }, r));
  } else if (op.type === 'entrega.create') {
    d.entregas = (d.entregas || []).concat([Object.assign({}, p, { numero: 'PENDIENTE', extintores: JSON.stringify(p.extintores), _pending: true })]);
  }
}

function phYears(agente) { return Number(cfg('PH_ANOS_' + String(agente || 'OTRO').toUpperCase()) || cfg('PH_ANOS_OTRO') || 5); }

async function trySync(manual) {
  if (S.syncing || !S.session) return;
  S.syncing = true; renderNet();
  try {
    const pending = S.queue.filter(o => !o.error);
    // Lotes de ~2.5 MB para no exceder límites
    let batch = [], size = 0;
    const batches = [];
    pending.forEach(o => { const s = JSON.stringify(o).length; if (batch.length && size + s > 2.5e6) { batches.push(batch); batch = []; size = 0; } batch.push(o); size += s; });
    if (batch.length) batches.push(batch);
    let okCount = 0, errCount = 0;
    for (const b of batches) {
      const out = await api('sync', { ops: b.map(o => ({ opId: o.opId, type: o.type, payload: o.payload })) }, 120000);
      out.results.forEach(r => {
        const o = S.queue.find(x => x.opId === r.opId); if (!o) return;
        if (r.ok) { S.queue = S.queue.filter(x => x !== o); okCount++; }
        else { o.error = r.error; errCount++; }
      });
      await DB.set('queue', S.queue);
    }
    await refresh(true);
    if (manual || okCount) toast(okCount ? '✓ ' + okCount + ' registro(s) sincronizado(s)' + (errCount ? ' · ' + errCount + ' con error' : '') : 'Datos actualizados');
    if (errCount) toast('Hay registros con error. Revise "Pendientes".', 4000);
  } catch (e) {
    if (manual) toast(e.offline ? 'Sin señal: los registros quedan guardados en el celular.' : e.message, 3500);
  } finally { S.syncing = false; renderNet(); }
}

/** Descarga los datos del servidor y vuelve a aplicar lo que aún está pendiente. */
async function refresh(silent) {
  const out = await api('bootstrap');
  delete out.ok;
  S.data = out;
  S.queue.forEach(applyLocal);
  S.lastSync = new Date().toISOString();
  await DB.set('lastSync', S.lastSync);
  await saveLocal();
  // No redibujar si el usuario está llenando un formulario o tiene un diálogo abierto
  const v = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/')[0];
  const busy = document.querySelector('.modal') || ['inspeccion', 'servicio', 'ext-form', 'entrega-nueva', 'ajustes', 'qr'].indexOf(v) >= 0;
  if (!silent || !busy) route(); else renderNet();
}

/* ============================ Estado de extintores (semáforo) ============================ */
function status(e) {
  if (e.estado === 'Dado de Baja') return { worst: 'g', items: [] };
  const t = today(), items = [];
  const di = Number(cfg('DIAS_INSPECCION') || 30);
  if (!e.ult_inspeccion) items.push({ k: 'Inspección', s: 'v', txt: 'Sin inspección' });
  else { const d = daysBetween(e.ult_inspeccion, t); items.push({ k: 'Inspección', s: d > di ? 'v' : d > di - 5 ? 'p' : 'ok', txt: 'Última ' + fdate(e.ult_inspeccion) + ' (hace ' + d + ' d)' }); }
  [['Mantenimiento', e.prox_mantenimiento, cfg('DIAS_AVISO')], ['Recarga', e.prox_recarga, cfg('DIAS_AVISO')], ['Prueba hidrostática', e.prox_ph, cfg('DIAS_AVISO_PH')]].forEach(x => {
    if (!x[1]) { items.push({ k: x[0], s: 'n', txt: 'Sin fecha registrada' }); return; }
    const d = daysBetween(t, x[1]);
    items.push({ k: x[0], s: d < 0 ? 'v' : d <= Number(x[2] || 30) ? 'p' : 'ok', txt: (d < 0 ? 'Vencido ' : 'Vence ') + fdate(x[1]) + (d < 0 ? ' (hace ' + (-d) + ' d)' : ' (en ' + d + ' d)') });
  });
  let worst = 'ok';
  if (items.some(i => i.s === 'p')) worst = 'p';
  if (items.some(i => i.s === 'v') || e.estado === 'Fuera de Servicio') worst = 'v';
  return { worst: worst, items: items };
}
const semLabel = { ok: 'Vigente', p: 'Por vencer', v: 'Vencido', g: 'De baja' };
const activos = () => (S.data.extintores || []).filter(e => e.estado !== 'Dado de Baja');

/* ============================ Enrutador ============================ */
function go(h) { location.hash = h; }
window.addEventListener('hashchange', route);

function route() {
  if (!S.session) return viewLogin();
  if (!S.data) return viewLoading();
  if (me().debe_cambiar === 'SI') return viewChangePassword(true);
  const h = location.hash.replace(/^#\/?/, '') || 'inicio';
  const [v, a] = h.split('/');
  const views = {
    inicio: viewDashboard, extintores: viewList, ext: () => viewExt(a), 'ext-form': () => viewExtForm(a),
    inspeccion: () => viewInspeccion(a), servicio: () => viewServicio(a), entregas: viewEntregas,
    'entrega-nueva': viewEntregaNueva, usuarios: viewUsuarios, empresas: viewEmpresas, pendientes: viewPendientes,
    ajustes: viewAjustes, inspecciones: viewInspecciones, servicios: viewServicios, qr: viewQrPrint
  };
  (views[v] || viewDashboard)();
  window.scrollTo(0, 0);
}

function shell(title, body, opts) {
  opts = opts || {};
  const tab = opts.tab || '';
  $('#app').innerHTML = `
  <header>
    ${opts.back ? `<button class="back" onclick="history.back()" aria-label="Volver">‹</button>` : ''}
    <h1>${esc(title)}</h1>
    <button class="net" id="net" onclick="trySync(true)"></button>
  </header>
  <main>${body}</main>
  <nav class="tabs">
    <a href="#/inicio" class="${tab === 'inicio' ? 'on' : ''}"><b>◉</b>Inicio</a>
    <a href="#/extintores" class="${tab === 'ext' ? 'on' : ''}"><b>🧯</b>Extintores</a>

async function doLogin(ev) {
  ev.preventDefault();
  const btn = $('#lg-btn'), err = $('#lg-err');
  btn.disabled = true; btn.textContent = 'Ingresando…'; err.classList.add('hide');
  try {
    const out = await api('login', { email: $('#lg-email').value, password: $('#lg-pass').value });
    S.session = { token: out.token, email: $('#lg-email').value.trim().toLowerCase() };
    await DB.set('session', S.session);
    viewLoading();
    await refresh();
    location.hash = '#/inicio'; route();
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hide');
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
}

async function logout(silent) {
  if (!silent && S.queue.length && !confirm('Tiene ' + S.queue.length + ' registro(s) sin sincronizar. Si cierra sesión se perderán. ¿Continuar?')) return;
  if (!silent) { try { await api('logout'); } catch (e) {} }
  S.session = null; S.data = null; S.queue = [];
  await DB.del('session'); await DB.del('data'); await DB.del('queue');
  route();
}

async function doChangePassword(ev) {

    </div>
    <div class="kpis">
      <div class="kpi info" onclick="filt('','','','')"><div class="n">${ext.length}</div><div class="l">Extintores activos</div></div>
      <div class="kpi bad" onclick="filt('','','v','')"><div class="n">${st.filter(x => x.s.worst === 'v').length}</div><div class="l">Con algo vencido</div></div>
      <div class="kpi warn" onclick="filt('','','p','')"><div class="n">${st.filter(x => x.s.worst === 'p').length}</div><div class="l">Por vencer</div></div>
      <div class="kpi ok" onclick="filt('','','ok','')"><div class="n">${st.filter(x => x.s.worst === 'ok').length}</div><div class="l">Vigentes</div></div>
    </div>
    <div class="card"><h2>Vencimientos por tipo</h2>
      <table><tr><th>Ítem</th><th class="tright">Vencidos</th><th class="tright">Por vencer</th></tr>
      ${['Inspección', 'Mantenimiento', 'Recarga', 'Prueba hidrostática'].map(k => `<tr><td>${k}</td><td class="tright"><span class="badge b-v">${cnt(k, 'v')}</span></td><td class="tright"><span class="badge b-p">${cnt(k, 'p')}</span></td></tr>`).join('')}

function filteredList() {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return (S.data.extintores || []).filter(e => {
    if (f.est === '' && e.estado === 'Dado de Baja') return false;
    if (f.est && f.est !== '*' && e.estado !== f.est) return false;
    if (f.emp && e.empresa_id !== f.emp) return false;
    if (q && ![e.codigo, e.serie, e.ubicacion, e.nivel, empName(e.empresa_id)].join(' ').toLowerCase().includes(q)) return false;
    if (f.sem && status(e).worst !== f.sem) return false;
    return true;
  }).sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es', { numeric: true }));
}

function renderList() {
  const l = filteredList(), el = $('#lst'); if (!el) return;
  const shown = l.slice(0, 300);
  el.innerHTML = shown.length ? shown.map(e => { const s = status(e); return `
    <div class="it" onclick="go('#/ext/${e.id}')">
      <span class="dot d-${s.worst}"></span>
      <div class="grow"><b>${esc(e.codigo)}</b> <span class="sub">· ${esc(e.agente)} ${esc(e.capacidad)}</span>${e._pending ? ' <span class="badge b-i">pendiente</span>' : ''}
        <div class="sub">${esc(empName(e.empresa_id))} · ${esc(e.ubicacion || 'sin ubicación')}</div></div>
      <span class="badge b-${s.worst === 'ok' ? 'ok' : s.worst === 'g' ? 'g' : s.worst}">${e.estado !== 'Operativo' ? esc(e.estado) : semLabel[s.worst]}</span>
    </div>`; }).join('') + (l.length > 300 ? `<div class="empty">Mostrando 300 de ${l.length}. Use la búsqueda.</div>` : '')
    : '<div class="empty">No hay extintores con esos filtros.</div>';
  const t = document.querySelector('header h1'); if (t) t.textContent = 'Extintores (' + l.length + ')';
}

function exportCsv() {
  const l = filteredList();
  const cols = ['codigo', 'serie', 'agente', 'clase', 'capacidad', 'empresa', 'ubicacion', 'nivel', 'proveedor', 'fecha_fabricacion', 'estado', 'ult_inspeccion', 'ult_mantenimiento', 'prox_mantenimiento', 'ult_recarga', 'prox_recarga', 'ult_ph', 'prox_ph', 'semaforo'];
  const rows = [cols.join(';')].concat(l.map(e => cols.map(c => {
    const v = c === 'empresa' ? empName(e.empresa_id) : c === 'semaforo' ? semLabel[status(e).worst] : (e[c] || '');
    return '"' + String(v).replace(/"/g, '""') + '"';
  }).join(';')));
  const blob = new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'extintores_' + today() + '.csv'; a.click();
}

async function saveExt(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target), p = {};
  fd.forEach((val, k) => p[k] = String(val).trim());
  p.codigo = p.codigo.replace(/\s+/g, ' ').toUpperCase();
  if (!seesAll()) p.empresa_id = me().empresa_id;
  if (!p.empresa_id) return toast('Seleccione la empresa / área.');
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s\-_.\/]+/g, '').toUpperCase();
  const dup = (S.data.extintores || []).find(x => norm(x.codigo) === norm(p.codigo) && x.id !== id && x.estado !== 'Dado de Baja');
  if (dup && !confirm('Ya existe un extintor con el código ' + dup.codigo + '. El servidor lo rechazará. ¿Guardar igual?')) return;
  p.id = id || uuid();
  const f = $('#ef-foto').files[0];
  if (f) p.foto = { data: await compressImage(f), mime: 'image/jpeg' };
  await enqueue('extintor.save', p, (id ? 'Edición ' : 'Alta ') + p.codigo);
  toast(S.online ? 'Guardado.' : 'Guardado en el celular. Se enviará al tener señal.');
  go('#/ext/' + p.id);
}

function setChk(btn, val) {
  const seg = btn.parentElement;
  seg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on'); seg.dataset.v = val;
  const nc = [...document.querySelectorAll('.seg')].some(s => s.dataset.v === 'NC');
  const r = $('#ins-res'); r.textContent = nc ? 'No Apto' : 'Apto'; r.className = 'badge ' + (nc ? 'b-v' : 'b-ok');
}
function allChk(v) { document.querySelectorAll('.seg').forEach(s => setChk(s.querySelector(v === 'C' ? '.c' : '.na'), v)); }

function getGps() {
  if (!navigator.geolocation) return toast('GPS no disponible.');
  toast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition(p => { $('#ins-gps').value = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6); },
    () => toast('No se pudo obtener GPS (normal en interior mina).'), { enableHighAccuracy: true, timeout: 15000 });
}

function svHint(extId) {
  const e = extById(extId), t = $('#sv-tipo').value, f = $('#sv-fecha').value;
  $('#sv-rec').classList.toggle('hide', t !== 'Mantenimiento');
  let calc = '';
  if (t === 'Mantenimiento') calc = addMonths(f, cfg('MESES_MANTENIMIENTO'));
  else if (t === 'Recarga') calc = addMonths(f, cfg('MESES_RECARGA'));
  else if (t === 'Prueba Hidrostática') calc = addMonths(f, 12 * phYears(e.agente));
  $('#sv-hint').textContent = calc ? 'Si deja vacía la próxima fecha, se usará ' + fdate(calc) + ' (según configuración).' : '';
}

async function saveServicio(ev, extId) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const p = { id: uuid(), extintor_id: extId, incluye_recarga: 'NO' };
  fd.forEach((v, k) => p[k] = String(v).trim());
  if (p.tipo !== 'Mantenimiento') p.incluye_recarga = 'NO';
  const f = $('#sv-cert').files[0];
  if (f) {
    if (f.type === 'application/pdf') {
      if (f.size > 4e6) return toast('El PDF supera 4 MB.');
      p.certificado = { data: await fileToB64(f), mime: 'application/pdf' };
    } else p.certificado = { data: await compressImage(f, 1600), mime: 'image/jpeg' };
  }
  await enqueue('servicio.create', p, p.tipo + ' ' + extById(extId).codigo);
  toast(S.online ? '✓ Servicio guardado.' : '✓ Guardado en el celular. Se enviará al tener señal.', 3000);
  history.back();
}

let SCAN_STREAM = null;
async function openScanner() {
  modal(`<h3 style="margin-top:0">Escanear QR del extintor</h3>
    <div class="scan"><video id="scan-v" playsinline muted></video></div>
    <p class="sub" id="scan-msg">Apunte la cámara a la etiqueta.</p>
    <div class="row"><input id="scan-code" class="grow" placeholder="…o escriba el código"><button class="btn sm" onclick="scanFound($('#scan-code').value)">Buscar</button></div>
    <button class="btn sec block" style="margin-top:10px" onclick="closeModal()">Cancelar</button>`, stopScanner);
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { $('#scan-msg').textContent = 'Este celular no lee QR desde la app. Escriba el código o use la cámara del celular.'; $('#scan-v').classList.add('hide'); return; }
  try {
    SCAN_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#scan-v'); v.srcObject = SCAN_STREAM; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (!SCAN_STREAM) return;
      try { const c = await det.detect(v); if (c.length) return scanFound(c[0].rawValue); } catch (e) {}
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { $('#scan-msg').textContent = 'No se pudo abrir la cámara. Escriba el código.'; }
}
function stopScanner() { if (SCAN_STREAM) { SCAN_STREAM.getTracks().forEach(t => t.stop()); SCAN_STREAM = null; } }
function scanFound(txt) {
  txt = String(txt || '').trim();
  let e = null;
  const m = txt.match(/EMF:([\w-]+)/); if (m) e = extById(m[1]);
  if (!e) { const nn = s => String(s).replace(/[\s\-_.\/]+/g, '').toUpperCase(); e = (S.data.extintores || []).find(x => nn(x.codigo) === nn(txt)); }
  if (!e) { toast('No se encontró el extintor: ' + txt.slice(0, 40)); return; }
  closeModal();
  go('#/ext/' + e.id);
}

async function saveUser(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target), p = { id: id || undefined };
  fd.forEach((v, k) => p[k] = String(v).trim());
  try {
    const r = await onlineOp('usuario.save', p);
    closeModal();
    if (r.clave_temporal) showTempPass(p.email, p.nombre, r.clave_temporal); else toast('Usuario guardado.');
    viewUsuarios();
  } catch (e) { toast(e.offline ? 'Necesita señal para gestionar usuarios.' : e.message, 3500); }
}

async function resetUser(id) {
  const u = S.data.usuarios.find(x => x.id === id);
  if (!confirm('¿Generar una nueva contraseña temporal para ' + u.email + '?')) return;
  try { const r = await onlineOp('usuario.reset', { id: id }); closeModal(); showTempPass(u.email, u.nombre, r.clave_temporal); }
  catch (e) { toast(e.offline ? 'Necesita señal.' : e.message, 3500); }
}

async function delUser(id) {
  const u = S.data.usuarios.find(x => x.id === id);
  if (!confirm('¿Eliminar al usuario ' + u.email + '?')) return;
  try { await onlineOp('usuario.delete', { id: id }); closeModal(); toast('Usuario eliminado.'); viewUsuarios(); }
  catch (e) { toast(e.offline ? 'Necesita señal.' : e.message, 3500); }
}

  modal(`<h3 style="margin-top:0">Contraseña temporal</h3>
    <p>Usuario: <b>${esc(email)}</b></p>
    <p style="font-size:26px;font-weight:700;letter-spacing:2px;text-align:center;background:#f3f4f6;padding:12px;border-radius:10px">${esc(pass)}</p>

    <a class="btn block" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar por WhatsApp</a>
    <button class="btn sec block" style="margin-top:8px" onclick="navigator.clipboard&&navigator.clipboard.writeText(${esc(JSON.stringify(msg))});toast('Copiado')">Copiar mensaje</button>
    <button class="btn ghost block" style="margin-top:6px" onclick="closeModal()">Cerrar</button>`);
}

/* ============================ Pendientes y ajustes ============================ */

  shell('Pendientes de envío (' + S.queue.length + ')', `
    <div class="card" style="padding:4px 10px"><div class="list">
      ${S.queue.length ? S.queue.map(o => `<div class="it" style="cursor:default"><div class="grow"><b>${esc(o.label || o.type)}</b>

async function retryOp(id) { const o = S.queue.find(x => x.opId === id); if (o) { delete o.error; await DB.set('queue', S.queue); trySync(true); viewPendientes(); } }
async function dropOp(id) {
  if (!confirm('¿Descartar este registro? No se enviará al servidor.')) return;
  S.queue = S.queue.filter(x => x.opId !== id); await DB.set('queue', S.queue);
  try { await refresh(true); } catch (e) {}
  viewPendientes();
}

async function saveCfg(ev) {

/* ============================ Modal, imágenes ============================ */
let MODAL_CLOSE = null;
function modal(html, onClose) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener('click', ev => { if (ev.target === m) closeModal(); });
  document.body.appendChild(m); MODAL_CLOSE = onClose || null;
}
function closeModal() { const m = document.querySelector('.modal'); if (m) m.remove(); if (MODAL_CLOSE) { MODAL_CLOSE(); MODAL_CLOSE = null; } }

function compressImage(file, max) {
  max = max || 1024;
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => rej(new Error('No se pudo leer la imagen.'));
    img.src = url;
  });
}
function fileToB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

/* ============================ Inicio ============================ */
(async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try {
    S.session = await DB.get('session') || null;
    S.data = await DB.get('data') || null;
    S.queue = await DB.get('queue') || [];
    S.lastSync = await DB.get('lastSync') || null;
  } catch (e) { console.warn(e); }
  route();
  if (S.session) {
    try { if (S.queue.length) await trySync(); else await refresh(true); }
    catch (e) { if (!S.data) $('#app').innerHTML = '<div class="empty" style="margin-top:25vh">Sin conexión y sin datos guardados.<br>Abra la app con señal la primera vez.<br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>'; }
  }
  window.addEventListener('online', () => trySync());
  setInterval(() => { if (S.queue.some(o => !o.error)) trySync(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.queue.some(o => !o.error)) trySync(); });
})();
</script>
