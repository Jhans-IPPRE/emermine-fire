<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1724">
<title>EmerMine Fire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<script src="logo.js"></script>
<script>try{var t=localStorage.getItem('emf-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* ===== Tokens: claro por defecto, oscuro "interior mina" ===== */
:root{
  --bg:#EDF2F6; --bg2:#E3EAF0; --surface:#FFFFFF; --surface2:#F5F8FB; --line:#D2DDE6; --line2:#B9C9D6;
  --ink:#0F2233; --muted:#587084; --faint:#8A9DAE;
  --accent:#1675AE; --accent-ink:#FFFFFF; --accent-soft:rgba(22,117,174,.10); --glow:rgba(22,117,174,.18);
  --ok:#11855A; --ok-soft:rgba(17,133,90,.12); --warn:#B26B00; --warn-soft:rgba(214,138,0,.15);
  --bad:#CC3527; --bad-soft:rgba(204,53,39,.11); --na:#6B7D8C; --na-soft:rgba(107,125,140,.14);
  --bar:#0F2233; --bar-ink:#FFFFFF; --plate:#FFFFFF;
  --shadow:0 1px 0 rgba(15,34,51,.04),0 6px 18px -10px rgba(15,34,51,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1724; --bg2:#0F1E2E; --surface:#122437; --surface2:#172C42; --line:#20384F; --line2:#2C4A66;
  --ink:#E4EDF5; --muted:#8EA6BC; --faint:#5F7A92;
  --accent:#3AA8E8; --accent-ink:#04121E; --accent-soft:rgba(58,168,232,.13); --glow:rgba(58,168,232,.30);
  --ok:#3DD598; --ok-soft:rgba(61,213,152,.14); --warn:#F7B947; --warn-soft:rgba(247,185,71,.15);
  --bad:#FF6152; --bad-soft:rgba(255,97,82,.15); --na:#8EA0B1; --na-soft:rgba(142,160,177,.14);
  --bar:#081320; --bar-ink:#E4EDF5; --plate:#F4F7FA;
  --shadow:0 0 0 1px rgba(58,168,232,.04),0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1724; --bg2:#0F1E2E; --surface:#122437; --surface2:#172C42; --line:#20384F; --line2:#2C4A66;
  --ink:#E4EDF5; --muted:#8EA6BC; --faint:#5F7A92;
  --accent:#3AA8E8; --accent-ink:#04121E; --accent-soft:rgba(58,168,232,.13); --glow:rgba(58,168,232,.30);
  --ok:#3DD598; --ok-soft:rgba(61,213,152,.14); --warn:#F7B947; --warn-soft:rgba(247,185,71,.15);
  --bad:#FF6152; --bad-soft:rgba(255,97,82,.15); --na:#8EA0B1; --na-soft:rgba(142,160,177,.14);
  --bar:#081320; --bar-ink:#E4EDF5; --plate:#F4F7FA;
  --shadow:0 0 0 1px rgba(58,168,232,.04),0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1200px 500px at 110% -10%,var(--accent-soft),transparent 60%),
  linear-gradient(var(--bg),var(--bg));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"Chakra Petch","Barlow",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ===== Barra superior ===== */
header{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(58,168,232,.35);box-shadow:0 1px 0 rgba(58,168,232,.12),0 8px 24px -16px rgba(0,0,0,.6)}
header h1{font:600 18px/1.2 "Chakra Petch",sans-serif;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{background:none;border:0;color:inherit;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
header .back:hover{background:rgba(255,255,255,.08)}
.plate{background:var(--plate);border-radius:8px;padding:3px 7px;display:flex;align-items:center;height:34px;flex:none}
.plate img{height:26px;display:block}
.iconbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:inherit;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.net{font:500 12px/1 "Barlow",sans-serif;padding:7px 10px;border-radius:99px;border:1px solid rgba(61,213,152,.45);color:#9FF0C9;background:rgba(61,213,152,.08);white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.net i{width:7px;height:7px;border-radius:50%;background:#3DD598;box-shadow:0 0 8px #3DD598}
.net.off{border-color:rgba(247,185,71,.5);color:#FFD98A;background:rgba(247,185,71,.08)}
.net.off i{background:#F7B947;box-shadow:0 0 8px #F7B947}
@media (max-width:420px){.net .t{display:none}.plate img{height:22px}}

main{max-width:900px;margin:0 auto;padding:16px 14px 104px}

/* ===== Navegación inferior ===== */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;text-align:center;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent);background:var(--accent-soft)}

/* ===== Superficies ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font:600 16px/1.25 "Chakra Petch",sans-serif;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font:400 13px "Barlow",sans-serif;color:var(--muted);margin-left:auto}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}

/* ===== Manómetro (tablero) ===== */
.gauge-card{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%)}
.gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{width:220px;max-width:100%;flex:none}
.gauge text{fill:var(--ink)}
.gauge .lbl{fill:var(--faint);font:500 11px "Barlow",sans-serif}
.gauge-info{flex:1;min-width:200px}
.gauge-info .big{font:700 44px/1 "Chakra Petch",sans-serif}
.gauge-info p{margin:6px 0 0;color:var(--muted)}
.strip{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg2);margin:14px 0 8px}
.strip i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend button{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.legend b{font:600 16px "Chakra Petch",sans-serif}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ===== Métricas y tablas ===== */
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}}
.metric{background:var(--surface);padding:12px 14px;cursor:pointer}
.metric:hover{background:var(--surface2)}
.metric .n{font:600 26px/1.1 "Chakra Petch",sans-serif}
.metric .l{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tright{text-align:right}
.minibar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;min-width:60px}
.minibar i{display:block;height:100%;background:var(--accent)}

/* ===== Listas ===== */
.list .it{display:flex;gap:12px;align-items:center;padding:12px 6px 12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--surface2)}
.list .it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--line2)}
.list .it.s-ok::before{background:var(--ok)} .list .it.s-p::before{background:var(--warn)} .list .it.s-v::before{background:var(--bad)} .list .it.s-g::before{background:var(--na)}
.list .it b.code{font:600 16px "Chakra Petch",sans-serif}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-ok{background:var(--ok)}.d-p{background:var(--warn)}.d-v{background:var(--bad)}.d-g{background:var(--na)}

/* ===== Etiquetas de estado ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.b-p{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.b-v{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.b-i{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.b-g{background:var(--na-soft);color:var(--na)}

/* ===== Botones y campos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;min-height:46px;box-shadow:0 6px 18px -10px var(--glow)}
.btn:hover{filter:brightness(1.07)}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2);box-shadow:none}
.btn.sec:hover{background:var(--surface2)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 10px;min-height:auto;box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);box-shadow:none}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);min-height:46px}
textarea{min-height:76px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:440px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:10px 0}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ===== Checklist de inspección ===== */
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-of-type{border-bottom:0}
.chk .n{font:600 13px "Chakra Petch",sans-serif;color:var(--faint);width:22px;flex:none}
.chk .q{flex:1;font-size:15px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface2);padding:9px 0;width:46px;font-weight:700;cursor:pointer;color:var(--faint)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on.c{background:var(--ok);color:#fff}.seg button.on.nc{background:var(--bad);color:#fff}.seg button.on.na{background:var(--na);color:#fff}
.verdict{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv div:nth-child(odd){color:var(--muted)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:99;max-width:92vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-weight:500}
.modal{position:fixed;inset:0;background:rgba(4,12,20,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal .box{background:var(--surface);border:1px solid var(--line);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.modal h3{font:600 18px "Chakra Petch",sans-serif;margin:0 0 10px}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:18px}}
.photo{width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:var(--surface2)}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.fab{position:fixed;right:16px;bottom:84px;z-index:15;border-radius:99px;padding:12px 20px}
.scan video{width:100%;border-radius:12px;background:#000}
.warnbox,.errbox,.okbox{padding:11px 13px;border-radius:10px;font-size:14px;margin-bottom:14px;border:1px solid}
.warnbox{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.errbox{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.okbox{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.hide{display:none!important}

/* ===== Acceso ===== */
.login{max-width:400px;margin:0 auto;padding:7vh 18px 30px}
.login .brand{background:var(--plate);border-radius:14px;padding:14px 18px;display:flex;justify-content:center;margin-bottom:22px;border:1px solid var(--line)}
.login .brand img{height:56px}
.login h2{font:700 28px/1.1 "Chakra Petch",sans-serif;margin:0}
.login .lead{color:var(--muted);margin:6px 0 18px}
.login .card{padding:18px}
.ext-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--bad);color:#fff;margin-right:8px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.needle{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
</style>
</head>

/* ============================ Almacenamiento local (IndexedDB) ============================ */
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('emermine', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); }); }
};

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const fdate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; };
function addMonths(dateStr, months) {
  if (!dateStr || months === '' || months == null || isNaN(Number(months))) return '';
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + Number(months), 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(p[2], last));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }

/* ============================ API ============================ */
async function api(action, body, timeoutMs) {
  if (!API_URL || API_URL.indexOf('http') !== 0) throw new Error('La app no tiene configurada la URL del servidor (API_URL).');
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), timeoutMs || 45000);
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.session && S.session.token }, body || {})), signal: ctl.signal, redirect: 'follow' });
  } catch (e) {
    setOnline(false);
    const err = new Error('Sin conexión con el servidor.'); err.offline = true; throw err;
  } finally { clearTimeout(to); }
  setOnline(true);
  let out;
  try { out = await res.json(); } catch (e) { throw new Error('Respuesta no válida del servidor.'); }
  if (!out.ok) {
    if (String(out.error || '').indexOf('AUTH:') === 0) { await logout(true); throw new Error(out.error.slice(5).trim()); }
    throw new Error(out.error || 'Error del servidor');
  }
  return out;
}

function setOnline(v) { if (S.online !== v) { S.online = v; renderNet(); } }

/* ============================ Cola offline y sincronización ============================ */
async function saveLocal() { await DB.set('data', S.data); await DB.set('queue', S.queue); }

/** Agrega una operación a la cola, la aplica en local y trata de sincronizar. */
async function enqueue(type, payload, label) {
  const op = { opId: uuid(), type: type, payload: payload, label: label, created: new Date().toISOString(), user: me().email };
  S.queue.push(op);
  applyLocal(op);
  await saveLocal();
  renderNet();
  trySync();
  return op;
}

/** Operaciones administrativas: requieren conexión (no se encolan). */
async function onlineOp(type, payload) {
  const out = await api('sync', { ops: [{ opId: uuid(), type: type, payload: payload }] });
  const r = out.results[0];
  if (!r.ok) throw new Error(r.error);
  await refresh(true);
  return r;
}

function applyLocal(op) {
  const d = S.data, p = op.payload;
  if (!d) return;
  if (op.type === 'inspeccion.create') {
    const e = extById(p.extintor_id); if (!e) return;
    let nc = 0; (d.catalogos.checklist || []).forEach(k => { if (p[k] === 'NC') nc++; });
    const r = Object.assign({}, p, { codigo: e.codigo, empresa_id: e.empresa_id, resultado: nc ? 'No Apto' : 'Apto', _pending: true });
    delete r.foto; if (p.foto) r._foto = p.foto.data;
    d.inspecciones = (d.inspecciones || []).filter(x => x.id !== p.id).concat([r]);
    if (!e.ult_inspeccion || p.fecha > e.ult_inspeccion) e.ult_inspeccion = p.fecha;
  } else if (op.type === 'servicio.create') {
    const e = extById(p.extintor_id); if (!e) return;
    const r = Object.assign({}, p, { codigo: e.codigo, empresa_id: e.empresa_id, _pending: true }); delete r.certificado;
    if (p.tipo === 'Mantenimiento') {
      e.ult_mantenimiento = p.fecha; e.prox_mantenimiento = p.proxima_fecha || addMonths(p.fecha, cfg('MESES_MANTENIMIENTO'));
      if (p.incluye_recarga === 'SI') { e.ult_recarga = p.fecha; e.prox_recarga = addMonths(p.fecha, cfg('MESES_RECARGA')); }
    } else if (p.tipo === 'Recarga') { e.ult_recarga = p.fecha; e.prox_recarga = p.proxima_fecha || addMonths(p.fecha, cfg('MESES_RECARGA')); }
    else if (p.tipo === 'Prueba Hidrostática') { e.ult_ph = p.fecha; e.prox_ph = p.proxima_fecha || addMonths(p.fecha, 12 * phYears(e.agente)); }
    d.servicios = (d.servicios || []).filter(x => x.id !== p.id).concat([r]);
  } else if (op.type === 'extintor.save') {
    const e = extById(p.id);
    const r = Object.assign({}, p, { _pending: true }); if (p.foto) r._foto = p.foto.data; delete r.foto;
    if (!r.prox_ph && !(e && e.prox_ph) && r.fecha_fabricacion) r.prox_ph = addMonths(r.fecha_fabricacion, 12 * phYears(r.agente));
    if (e) Object.assign(e, r); else d.extintores.unshift(Object.assign({ estado: 'Operativo', creado: new Date().toISOString() }, r));
  } else if (op.type === 'entrega.create') {
    d.entregas = (d.entregas || []).concat([Object.assign({}, p, { numero: 'PENDIENTE', extintores: JSON.stringify(p.extintores), _pending: true })]);
  }
}

function phYears(agente) { return Number(cfg('PH_ANOS_' + String(agente || 'OTRO').toUpperCase()) || cfg('PH_ANOS_OTRO') || 5); }

async function trySync(manual) {
  if (S.syncing || !S.session) return;
  S.syncing = true; renderNet();
  try {
    const pending = S.queue.filter(o => !o.error);
    // Lotes de ~2.5 MB para no exceder límites
    let batch = [], size = 0;
    const batches = [];
    pending.forEach(o => { const s = JSON.stringify(o).length; if (batch.length && size + s > 2.5e6) { batches.push(batch); batch = []; size = 0; } batch.push(o); size += s; });
    if (batch.length) batches.push(batch);
    let okCount = 0, errCount = 0;
    for (const b of batches) {
      const out = await api('sync', { ops: b.map(o => ({ opId: o.opId, type: o.type, payload: o.payload })) }, 120000);
      out.results.forEach(r => {
        const o = S.queue.find(x => x.opId === r.opId); if (!o) return;
        if (r.ok) { S.queue = S.queue.filter(x => x !== o); okCount++; }
        else { o.error = r.error; errCount++; }
      });
      await DB.set('queue', S.queue);
    }
    await refresh(true);
    if (manual || okCount) toast(okCount ? '✓ ' + okCount + ' registro(s) sincronizado(s)' + (errCount ? ' · ' + errCount + ' con error' : '') : 'Datos actualizados');
    if (errCount) toast('Hay registros con error. Revise "Pendientes".', 4000);
  } catch (e) {
    if (manual) toast(e.offline ? 'Sin señal: los registros quedan guardados en el celular.' : e.message, 3500);
  } finally { S.syncing = false; renderNet(); }
}

/** Descarga los datos del servidor y vuelve a aplicar lo que aún está pendiente. */

}

function status(e) {
  if (e.estado === 'Dado de Baja') return { worst: 'g', items: [] };
  const t = today(), items = [];
  const di = Number(cfg('DIAS_INSPECCION') || 30);
  if (!e.ult_inspeccion) items.push({ k: 'Inspección', s: 'v', txt: 'Sin inspección' });
  else { const d = daysBetween(e.ult_inspeccion, t); items.push({ k: 'Inspección', s: d > di ? 'v' : d > di - 5 ? 'p' : 'ok', txt: 'Última ' + fdate(e.ult_inspeccion) + ' (hace ' + d + ' d)' }); }
  [['Mantenimiento', e.prox_mantenimiento, cfg('DIAS_AVISO')], ['Recarga', e.prox_recarga, cfg('DIAS_AVISO')], ['Prueba hidrostática', e.prox_ph, cfg('DIAS_AVISO_PH')]].forEach(x => {
    if (!x[1]) { items.push({ k: x[0], s: 'n', txt: 'Sin fecha registrada' }); return; }
    const d = daysBetween(t, x[1]);
    items.push({ k: x[0], s: d < 0 ? 'v' : d <= Number(x[2] || 30) ? 'p' : 'ok', txt: (d < 0 ? 'Vencido ' : 'Vence ') + fdate(x[1]) + (d < 0 ? ' (hace ' + (-d) + ' d)' : ' (en ' + d + ' d)') });
  });
  let worst = 'ok';
  if (items.some(i => i.s === 'p')) worst = 'p';
  if (items.some(i => i.s === 'v') || e.estado === 'Fuera de Servicio') worst = 'v';
  return { worst: worst, items: items };
}

/* Manómetro semicircular: % de extintores inspeccionados en el mes */
function gaugeSvg(pct) {
  const cx = 110, cy = 110, r = 86;
  const pt = (p, rr) => { const a = Math.PI * (1 - p / 100); return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; };
  const arc = (a, b, rr) => { const p1 = pt(a, rr), p2 = pt(b, rr); return `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A${rr} ${rr} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; };
  let ticks = '';
  for (let i = 0; i <= 100; i += 5) { const a = pt(i, r - 14), b = pt(i, r - (i % 25 ? 19 : 24)); ticks += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--line2)" stroke-width="${i % 25 ? 1 : 2}"/>`; }
  const lbl = [0, 50, 100].map(v => { const p = pt(v, r - 36); return `<text class="lbl" x="${p[0].toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" text-anchor="middle">${v}</text>`; }).join('');
  const rot = -90 + 1.8 * Math.max(0, Math.min(100, pct));
  return `<svg class="gauge" viewBox="0 0 220 128" role="img" aria-label="${pct}% inspeccionado este mes">
    <path d="${arc(0, 100, r)}" stroke="var(--bg2)" stroke-width="16" fill="none"/>
    <path d="${arc(0, 59.5, r)}" stroke="var(--bad)" stroke-width="16" fill="none" opacity=".85"/>
    <path d="${arc(60.5, 89.5, r)}" stroke="var(--warn)" stroke-width="16" fill="none" opacity=".85"/>
    <path d="${arc(90.5, 100, r)}" stroke="var(--ok)" stroke-width="16" fill="none" opacity=".9"/>
    ${ticks}${lbl}
    <g class="needle" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)" data-rot="${rot}">
      <path d="M${cx - 4} ${cy} L${cx} ${cy - r + 8} L${cx + 4} ${cy} Z" fill="var(--ink)"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
  </svg>`;
}
function animateGauge() {
  const n = document.querySelector('.needle'); if (!n) return;
  requestAnimationFrame(() => requestAnimationFrame(() => { n.style.transform = 'rotate(' + n.dataset.rot + 'deg)'; }));

  const ext = activos(), t = today(), mes = t.slice(0, 7);
  const st = ext.map(e => ({ e: e, s: status(e) }));
  const insMes = new Set((S.data.inspecciones || []).filter(i => String(i.fecha).slice(0, 7) === mes).map(i => i.extintor_id));
  const inspeccionados = ext.filter(e => insMes.has(e.id)).length;
  const pct = ext.length ? Math.round(100 * inspeccionados / ext.length) : 0;
  const cnt = (k, s) => st.filter(x => x.s.items.some(i => i.k === k && i.s === s)).length;
  const fuera = ext.filter(e => e.estado === 'Fuera de Servicio' || e.estado === 'En Mantenimiento').length;
  const noApt = (S.data.inspecciones || []).filter(i => i.resultado === 'No Apto' && daysBetween(i.fecha, t) <= 30).length;
  const sinEmp = !seesAll() && !me().empresa_id;
  const nv = st.filter(x => x.s.worst === 'v').length, np = st.filter(x => x.s.worst === 'p').length, nok = st.filter(x => x.s.worst === 'ok').length;
  const w = n => ext.length ? (100 * n / ext.length).toFixed(2) + '%' : '0';
  const faltan = ext.length - inspeccionados;
  const diasMes = new Date(+t.slice(0, 4), +t.slice(5, 7), 0).getDate(), quedan = diasMes - +t.slice(8, 10);

  const byEmp = {};
  st.forEach(x => { const k = x.e.empresa_id || ''; byEmp[k] = byEmp[k] || { n: 0, ins: 0, v: 0, p: 0 }; byEmp[k].n++; if (insMes.has(x.e.id)) byEmp[k].ins++; if (x.s.worst === 'v') byEmp[k].v++; else if (x.s.worst === 'p') byEmp[k].p++; });
  const empRows = Object.keys(byEmp).map(k => ({ k: k, name: empName(k), ...byEmp[k] })).sort((a, b) => b.v - a.v || a.name.localeCompare(b.name));
  const alertas = st.filter(x => x.s.worst !== 'ok').sort((a, b) => (a.s.worst === 'v' ? 0 : 1) - (b.s.worst === 'v' ? 0 : 1)).slice(0, 25);
  const mesTxt = new Date().toLocaleString('es-PE', { month: 'long', year: 'numeric' });

  shell(cfg('NOMBRE_SISTEMA') || 'EmerMine Fire', `
    ${sinEmp ? '<div class="errbox">Su usuario no tiene empresa / área asignada. Pida al administrador que se la asigne para ver sus extintores.</div>' : ''}
    ${S.queue.filter(o => o.error).length ? '<div class="errbox">Hay registros que no se pudieron sincronizar. <a href="#/pendientes">Revisar</a></div>' : ''}
    <p class="sub" style="margin:0 0 12px">${esc(me().nombre)} · ${esc(me().rol)}${me().empresa_id ? ' · ' + esc(empName(me().empresa_id)) : ''}<br>Actualizado ${S.lastSync ? new Date(S.lastSync).toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' }) : '—'}</p>
    <div class="card gauge-card">
      <h2 style="margin:0">Inspección mensual <span class="hint">${esc(mesTxt)}</span></h2>
      <div class="gauge-wrap">
        ${gaugeSvg(pct)}
        <div class="gauge-info">
          <div class="big num">${pct}<span style="font-size:24px">%</span></div>
          <p><b class="num" style="color:var(--ink)">${inspeccionados}</b> de <b class="num" style="color:var(--ink)">${ext.length}</b> extintores inspeccionados.</p>
          <p>${faltan > 0 ? `Faltan <b class="num" style="color:var(--ink)">${faltan}</b> · quedan ${quedan} día(s) del mes.` : 'Todos los extintores están inspeccionados este mes.'}</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Estado de los extintores activos</h2>
      <div class="strip" role="img" aria-label="${nv} vencidos, ${np} por vencer, ${nok} vigentes"><i style="width:${w(nv)};background:var(--bad)"></i><i style="width:${w(np)};background:var(--warn)"></i><i style="width:${w(nok)};background:var(--ok)"></i></div>
      <div class="legend">
        <button onclick="filt('','','v','')"><span class="sw" style="background:var(--bad)"></span>Con algo vencido <b>${nv}</b></button>
        <button onclick="filt('','','p','')"><span class="sw" style="background:var(--warn)"></span>Por vencer <b>${np}</b></button>
        <button onclick="filt('','','ok','')"><span class="sw" style="background:var(--ok)"></span>Vigentes <b>${nok}</b></button>
      </div>
    </div>
    <div class="metrics" style="margin-bottom:14px">
      ${['Inspección', 'Mantenimiento', 'Recarga', 'Prueba hidrostática'].map(k => { const v = cnt(k, 'v'), p = cnt(k, 'p'); return `<div class="metric" onclick="filt('','','v','')"><div class="n num" style="color:${v ? 'var(--bad)' : 'var(--ink)'}">${v}</div><div class="l">${k}: vencidos${p ? ` · <span style="color:var(--warn)">${p} por vencer</span>` : ''}</div></div>`; }).join('')}
    </div>
    <div class="card">
      <table>
        <tr><td>Fuera de servicio / en mantenimiento</td><td class="tright"><span class="badge b-g num">${fuera}</span></td></tr>
        <tr><td>Inspecciones No Apto (últimos 30 días)</td><td class="tright"><span class="badge ${noApt ? 'b-v' : 'b-ok'} num">${noApt}</span></td></tr>
      </table>
    </div>
    ${seesAll() ? `<div class="card"><h2>Cumplimiento por empresa / área <span class="hint">mes actual</span></h2>
      <div style="overflow-x:auto"><table><tr><th>Empresa / Área</th><th class="tright">Ext.</th><th style="min-width:110px">Inspección</th><th class="tright">Venc.</th></tr>
      ${empRows.map(r => { const pc = Math.round(100 * r.ins / r.n); return `<tr onclick="filt('','${esc(r.k)}','','')" style="cursor:pointer"><td>${esc(r.name)}</td><td class="tright num">${r.n}</td><td><div class="row" style="gap:6px"><div class="minibar grow"><i style="width:${pc}%;background:${pc >= 90 ? 'var(--ok)' : pc >= 60 ? 'var(--warn)' : 'var(--bad)'}"></i></div><span class="num" style="font-size:13px;min-width:34px;text-align:right">${pc}%</span></div></td><td class="tright">${r.v ? `<span class="badge b-v num">${r.v}</span>` : '<span class="num muted">0</span>'}</td></tr>`; }).join('')}
      </table></div></div>` : ''}
    <div class="card" style="padding-bottom:6px"><h2>Alertas <span class="hint">${alertas.length ? 'los más urgentes primero' : ''}</span></h2>
      ${alertas.length ? `<div class="list" style="margin:0 -16px">${alertas.map(x => `
        <div class="it s-${x.s.worst}" onclick="go('#/ext/${x.e.id}')" style="padding-left:18px">
          <div class="grow"><b class="code">${esc(x.e.codigo)}</b> <span class="sub">${esc(empName(x.e.empresa_id))}</span>
          <div class="sub">${x.s.items.filter(i => i.s === 'v' || i.s === 'p').map(i => esc(i.k + ': ' + i.txt)).join(' · ') || esc(x.e.estado)}</div></div>
        </div>`).join('')}</div>` : '<div class="empty">Sin alertas. Todo vigente.</div>'}
    </div>
  `, { tab: 'inicio' });
  animateGauge();
}

function filteredList() {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return (S.data.extintores || []).filter(e => {
    if (f.est === '' && e.estado === 'Dado de Baja') return false;
    if (f.est && f.est !== '*' && e.estado !== f.est) return false;
    if (f.emp && e.empresa_id !== f.emp) return false;
    if (q && ![e.codigo, e.serie, e.marca, e.ubicacion, e.nivel, empName(e.empresa_id)].join(' ').toLowerCase().includes(q)) return false;
    if (f.sem && status(e).worst !== f.sem) return false;
    return true;
  }).sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es', { numeric: true }));
}

async function delExt(id) {
  const e = extById(id);

}

async function saveExt(ev, id) {
  ev.preventDefault();
  const fd = new FormData(ev.target), p = {};
  fd.forEach((val, k) => p[k] = String(val).trim());
  p.codigo = p.codigo.replace(/\s+/g, ' ').toUpperCase();
  if (!seesAll()) p.empresa_id = me().empresa_id;
  if (!p.empresa_id) return toast('Seleccione el área o contratista.');
  const prev = id ? extById(id) : null;
  if (p.ult_mantenimiento) {
    const changed = !prev || p.ult_mantenimiento !== (prev.ult_mantenimiento || prev.ult_recarga || '');
    if (changed) {
      p.ult_recarga = p.ult_mantenimiento;
      if (!p.prox_mantenimiento || (prev && p.prox_mantenimiento === prev.prox_mantenimiento)) p.prox_mantenimiento = addMonths(p.ult_mantenimiento, cfg('MESES_MANTENIMIENTO'));
      if (!p.prox_recarga || (prev && p.prox_recarga === prev.prox_recarga)) p.prox_recarga = addMonths(p.ult_mantenimiento, cfg('MESES_RECARGA'));
    }
  }
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\s\-_.\/]+/g, '').toUpperCase();
  const dup = (S.data.extintores || []).find(x => norm(x.codigo) === norm(p.codigo) && x.id !== id && x.estado !== 'Dado de Baja');
  if (dup && !confirm('Ya existe un extintor con el código ' + dup.codigo + '. El servidor lo rechazará. ¿Guardar igual?')) return;
  p.id = id || uuid();
  const f = $('#ef-foto').files[0];
  if (f) p.foto = { data: await compressImage(f), mime: 'image/jpeg' };
  await enqueue('extintor.save', p, (id ? 'Edición ' : 'Alta ') + p.codigo);
  toast(S.online ? 'Extintor guardado.' : 'Guardado en el celular. Se enviará al tener señal.');
  go('#/ext/' + p.id);
}

function setChk(btn, val) {

  const r = $('#ins-res'); r.textContent = nc ? 'No Apto' : 'Apto'; r.className = 'badge ' + (nc ? 'b-v' : 'b-ok');

    () => toast('No se pudo obtener GPS (normal en interior mina).'), { enableHighAccuracy: true, timeout: 15000 });
}

  const e = extById(extId), t = $('#sv-tipo').value, f = $('#sv-fecha').value;
  $('#sv-rec').classList.toggle('hide', t !== 'Mantenimiento');
  let calc = '';
  if (t === 'Mantenimiento') calc = addMonths(f, cfg('MESES_MANTENIMIENTO'));
  else if (t === 'Recarga') calc = addMonths(f, cfg('MESES_RECARGA'));
  else if (t === 'Prueba Hidrostática') calc = addMonths(f, 12 * phYears(e.agente));
  $('#sv-hint').textContent = calc ? 'Si deja vacía la próxima fecha, se usará ' + fdate(calc) + ' (según configuración).' : '';

let SCAN_STREAM = null;
async function openScanner() {
  modal(`<h3>Escanear QR del extintor</h3>
    <div class="scan"><video id="scan-v" playsinline muted></video></div>
    <p class="sub" id="scan-msg">Apunte la cámara a la etiqueta.</p>
    <div class="row"><input id="scan-code" class="grow" placeholder="…o escriba el código"><button class="btn sm" onclick="scanFound($('#scan-code').value)">Buscar</button></div>
    <button class="btn sec block" style="margin-top:10px" onclick="closeModal()">Cancelar</button>`, stopScanner);
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { $('#scan-msg').textContent = 'Este celular no lee QR desde la app. Escriba el código o use la cámara del celular.'; $('#scan-v').classList.add('hide'); return; }
  try {
    SCAN_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#scan-v'); v.srcObject = SCAN_STREAM; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (!SCAN_STREAM) return;
      try { const c = await det.detect(v); if (c.length) return scanFound(c[0].rawValue); } catch (e) {}
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { $('#scan-msg').textContent = 'No se pudo abrir la cámara. Escriba el código.'; }
}
function stopScanner() { if (SCAN_STREAM) { SCAN_STREAM.getTracks().forEach(t => t.stop()); SCAN_STREAM = null; } }
function scanFound(txt) {
  txt = String(txt || '').trim();
  let e = null;
  const m = txt.match(/EMF:([\w-]+)/); if (m) e = extById(m[1]);
  if (!e) { const nn = s => String(s).replace(/[\s\-_.\/]+/g, '').toUpperCase(); e = (S.data.extintores || []).find(x => nn(x.codigo) === nn(txt)); }
  if (!e) { toast('No se encontró el extintor: ' + txt.slice(0, 40)); return; }
  closeModal();
  go('#/ext/' + e.id);
}

const XLS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
let XLS_P = null;
function loadExcel() {
  if (window.ExcelJS) return Promise.resolve();
  if (XLS_P) return XLS_P;
  XLS_P = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = XLS_URL;
    s.onload = () => res();
    s.onerror = () => { XLS_P = null; s.remove(); rej(new Error('No se pudo cargar el módulo de Excel. Abra la app con señal una vez.')); };
    document.head.appendChild(s);
  });
  return XLS_P;
}

/* Columnas del formato (A–J) y anomalías (K–AA) */
const FMT_COLS = [['ÍTEM', 5.9], ['ÁREA O CONTRATISTA RESPONSABLE', 36], ['UBICACIÓN', 40], ['TIPO', 8.5], ['CAPACIDAD', 10],
  ['Nº EXTINTOR', 14], ['NÚMERO DE SERIE', 13], ['FECHA DE MANTENIMIENTO Y RECARGA', 14], ['PRÓXIMA PRUEBA HIDROSTÁTICA', 14], ['MARCA', 12]];
const FMT_ITEMS = ['1. Ubicado', '2. Acceso Obstruido', '3. Zona y/o Extintor no numerados', '4. Pictograma de clase de fuego',
  '5. Pictograma de forma de uso', '6. Etiqueta de recarga', '7. Colgador: Ausente / inadecuado', '8. Sin pasador y/o precinto de seguridad',
  '9. Manómetro: con presión inadecuada / dañado', '10. Manija de acarreo/palanca de activación de cabeza/pistola dañada/ausente',
  '11. Manguera: Dañada / Ausente', '12. Tobera, pitón o pistola: Dañada / Ausente', '13. Abrazadera o sujetador de manguera: inadecuado/dañado/ausente',
  '14. Cilindro / botella / cartucho / impulso en mal estado', '15. Pintura deteriorada en: Cilindro / Botella / Cartucho impulsor', '16. Prueba Hidrostática'];
const FMT_KEYS = ['ubicado', 'acceso', 'numerado', 'picto_clase', 'picto_uso', 'etiqueta_recarga', 'colgador', 'pasador_precinto', 'manometro', 'manija', 'manguera', 'tobera', 'abrazadera', 'cilindro', 'pintura', 'ph'];
const TIPOS_XLS = ['PQS', 'CO2', 'AGUA', 'ESPUMA', 'K', 'HALOTRON'];

const xBorder = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
const xDate = iso => { if (!iso) return null; const p = String(iso).slice(0, 10).split('-').map(Number); return p.length === 3 && p[0] ? new Date(Date.UTC(p[0], p[1] - 1, p[2])) : null; };
const toTipo = a => { const u = String(a || '').toUpperCase(); return u.indexOf('ACETATO') >= 0 ? 'K' : u === 'POLVO ABC' ? 'PQS' : u; };

/** Crea la hoja FORMATO con el mismo diseño del formato de PASHSA. rows = arreglo de filas ya armadas. */
function buildFormato(wb, title, subtitle, rows, opts) {
  opts = opts || {};
  const lastCol = opts.extraCol ? 28 : 27;
  const ws = wb.addWorksheet('FORMATO', {
    pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '3:5',
      margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } },
    views: [{ state: 'frozen', xSplit: 0, ySplit: 5 }],
    headerFooter: { oddFooter: '&L&8EmerMine Fire&R&8Página &P de &N' }
  });
  FMT_COLS.forEach((c, i) => { ws.getColumn(i + 1).width = c[1]; });
  for (let c = 11; c <= 26; c++) ws.getColumn(c).width = 5.7;
  ws.getColumn(27).width = 32.6;
  if (opts.extraCol) ws.getColumn(28).width = 13;

  // Filas 1–2: logo + título
  ws.getRow(1).height = 40; ws.getRow(2).height = 22;
  ws.mergeCells(1, 4, 1, lastCol); ws.mergeCells(2, 4, 2, lastCol); ws.mergeCells(1, 1, 2, 3);
  const t1 = ws.getCell(1, 4); t1.value = title; t1.font = { name: 'Arial', size: 15, bold: true, color: { argb: 'FF0F2233' } }; t1.alignment = { vertical: 'middle' };
  const t2 = ws.getCell(2, 4); t2.value = subtitle; t2.font = { name: 'Arial', size: 9, color: { argb: 'FF587084' } }; t2.alignment = { vertical: 'top' };
  if (window.LOGO_PAS) {
    const id = wb.addImage({ base64: window.LOGO_PAS, extension: 'png' });
    ws.addImage(id, { tl: { col: 0.15, row: 0.15 }, ext: { width: 180, height: 58 } });
  }

  // Encabezado filas 3–5
  ws.getRow(3).height = 15.75; ws.getRow(4).height = 12.75; ws.getRow(5).height = 105.75;
  const head = (cell, v, rot) => {
    cell.value = v; cell.font = { name: 'Arial', size: rot ? 8 : 9, bold: true };
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true, textRotation: rot ? 90 : 0 };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFBDD7EE' } };
    cell.border = xBorder;
  };
  FMT_COLS.forEach((c, i) => { ws.mergeCells(3, i + 1, 5, i + 1); head(ws.getCell(3, i + 1), c[0]); });
  ws.mergeCells(3, 11, 3, 27); head(ws.getCell(3, 11), 'ANOMALÍAS');
  FMT_ITEMS.forEach((t, i) => { ws.mergeCells(4, 11 + i, 5, 11 + i); head(ws.getCell(4, 11 + i), t, true); });
  ws.mergeCells(4, 27, 5, 27); head(ws.getCell(4, 27), '17. Otros (Indicar)');
  if (opts.extraCol) { ws.mergeCells(3, 28, 5, 28); head(ws.getCell(3, 28), 'FECHA ÚLTIMA INSPECCIÓN'); }
  for (let r = 3; r <= 5; r++) for (let c = 1; c <= lastCol; c++) { const x = ws.getCell(r, c); x.border = xBorder; if (!x.fill || !x.fill.fgColor) x.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFBDD7EE' } }; }

  // Datos desde la fila 6
  rows.forEach((vals, i) => {
    const r = ws.getRow(6 + i); r.height = 30;
    for (let c = 1; c <= lastCol; c++) {
      const cell = r.getCell(c), v = vals[c - 1];
      if (v && typeof v === 'object' && !(v instanceof Date) && v.mark) {
        cell.value = v.mark;
        cell.font = v.wing ? { name: 'Wingdings', size: 12, color: { argb: v.color } } : { name: 'Arial', size: 8, color: { argb: v.color } };
      } else {
        cell.value = v == null ? null : v;
        cell.font = { name: 'Arial', size: 10 };
      }
      if (v instanceof Date || c === 8 || c === 9 || c === 28) cell.numFmt = 'dd/mm/yyyy';
      cell.alignment = { vertical: 'middle', horizontal: (c === 2 || c === 3 || c === 27) ? 'left' : 'center', wrapText: true };
      cell.border = xBorder;
    }
  });
  return ws;
}

function saveBlob(buf, name) {
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/** Listado general en el formato oficial (para fiscalizaciones). Respeta los filtros de la lista. */
async function xlsListado() {
  const l = filteredList();
  if (!l.length) return toast('No hay extintores con esos filtros.');
  toast('Generando listado…');
  try { await loadExcel(); } catch (e) { return toast(e.message, 4000); }
  const lastIns = {};
  (S.data.inspecciones || []).forEach(i => { const k = i.extintor_id, cur = lastIns[k]; if (!cur || (i.fecha + (i.hora || '')) > (cur.fecha + (cur.hora || ''))) lastIns[k] = i; });
  const keys = FMT_KEYS;
  const rows = l.map((e, n) => {
    const i = lastIns[e.id];
    const marks = keys.map(k => !i || !i[k] ? null : i[k] === 'NC' ? { mark: 'û', wing: true, color: 'FFC00000' } : i[k] === 'NA' ? { mark: 'N/A', color: 'FF7F7F7F' } : { mark: 'ü', wing: true, color: 'FF00A050' });
    return [n + 1, empName(e.empresa_id), [e.ubicacion, e.nivel].filter(Boolean).join(' · '), toTipo(e.agente), e.capacidad || '', e.codigo, e.serie || '',
      xDate(e.ult_mantenimiento || e.ult_recarga), xDate(e.prox_ph), e.marca || ''].concat(marks, [i ? (i.observaciones || '') : '', i ? xDate(i.fecha) : null]);
  });
  const f = S.filters, partes = [];
  if (!seesAll()) partes.push(empName(me().empresa_id));
  else if (f.emp) partes.push(empName(f.emp));
  if (f.sem) partes.push(semLabel[f.sem]);
  if (f.est && f.est !== '*') partes.push(f.est);
  if (f.q) partes.push('búsqueda "' + f.q + '"');
  const sub = (cfg('ORGANIZACION') || 'U.M. Huarón') + ' · ' + (partes.length ? partes.join(' · ') : 'Todas las áreas y contratistas') + ' · ' + l.length + ' extintores · Generado el ' + fdate(today()) + ' ' + nowTime() + ' por ' + (me().nombre || me().email) + ' · Anomalías según la última inspección: ü conforme, û anomalía';
  const wb = new ExcelJS.Workbook(); wb.creator = 'EmerMine Fire'; wb.created = new Date();
  buildFormato(wb, 'LISTADO GENERAL DE EXTINTORES', sub, rows, { extraCol: true });
  const buf = await wb.xlsx.writeBuffer();
  saveBlob(buf, 'Listado_extintores_' + today() + '.xlsx');
  toast('Listado descargado (' + l.length + ' extintores).', 3500);
}

/** Plantilla vacía para la carga masiva */
async function xlsPlantilla() {
  toast('Preparando plantilla…');
  try { await loadExcel(); } catch (e) { return toast(e.message, 4000); }
  const wb = new ExcelJS.Workbook(); wb.creator = 'EmerMine Fire';
  const N = 300, blank = []; for (let i = 0; i < N; i++) blank.push([i + 1]);
  const emp = seesAll() ? (S.data.empresas || []).filter(x => x.activo !== 'NO').map(x => x.nombre).sort((a, b) => a.localeCompare(b)) : [empName(me().empresa_id)];
  const ws = buildFormato(wb, 'REGISTRO DE EXTINTORES — CARGA MASIVA', 'Llene una fila por extintor desde la fila 6. Obligatorio: Nº EXTINTOR. Fechas en formato dd/mm/aaaa. Las columnas de anomalías (K–AA) no se cargan.', blank);
  const ls = wb.addWorksheet('Listas', { state: 'veryHidden' });
  emp.forEach((n, i) => { ls.getCell(i + 1, 1).value = n; });
  TIPOS_XLS.forEach((n, i) => { ls.getCell(i + 1, 2).value = n; });
  for (let r = 6; r < 6 + N; r++) {
    ws.getCell(r, 2).dataValidation = { type: 'list', allowBlank: true, formulae: ['Listas!$A$1:$A$' + Math.max(1, emp.length)], showErrorMessage: false };
    ws.getCell(r, 4).dataValidation = { type: 'list', allowBlank: true, formulae: ['Listas!$B$1:$B$' + TIPOS_XLS.length], showErrorMessage: false };
    [8, 9].forEach(c => { ws.getCell(r, c).dataValidation = { type: 'date', operator: 'greaterThan', allowBlank: true, formulae: [new Date(Date.UTC(1990, 0, 1))], showInputMessage: true, promptTitle: 'Fecha', prompt: 'Escriba la fecha como dd/mm/aaaa', showErrorMessage: true, errorTitle: 'Fecha', error: 'Escriba una fecha válida (dd/mm/aaaa).' }; });
  }
  const ins = wb.addWorksheet('Instrucciones');
  ins.getColumn(1).width = 110;
  ['CÓMO LLENAR LA PLANTILLA', '',
    '1. Una fila por extintor, desde la fila 6 de la hoja FORMATO. No cambie el orden ni los títulos de las columnas.',
    '2. Nº EXTINTOR (código interno) es obligatorio y no puede repetirse. Si el código ya existe en la app, la fila actualiza ese extintor.',
    '3. ÁREA O CONTRATISTA RESPONSABLE: elija de la lista. ' + (seesAll() ? 'Si su empresa no aparece, pida al administrador que la registre.' : 'Para su usuario siempre se usa: ' + empName(me().empresa_id) + '.'),
    '4. TIPO: PQS, CO2, AGUA, ESPUMA, K (acetato de potasio) o HALOTRON.',
    '5. CAPACIDAD: por ejemplo "6 kg", "9 kg", "10 lb". Si escribe solo el número se asume kg.',
    '6. FECHA DE MANTENIMIENTO Y RECARGA: fecha del último servicio. La app calcula el próximo mantenimiento y la próxima recarga.',
    '7. PRÓXIMA PRUEBA HIDROSTÁTICA: fecha completa (dd/mm/aaaa). Si solo conoce el año, escriba el año (se toma el 1 de enero).',
    '8. Las columnas de anomalías (K a AA) se llenan con las inspecciones en la app; en la carga masiva se ignoran.',
    '9. Guarde como Excel (.xlsx) y cárguelo en la app: Extintores › Carga masiva.'
  ].forEach((t, i) => { const c = ins.getCell(i + 1, 1); c.value = t; c.font = { name: 'Arial', size: i ? 11 : 13, bold: !i }; c.alignment = { wrapText: true, vertical: 'top' }; });
  const buf = await wb.xlsx.writeBuffer();
  saveBlob(buf, 'Plantilla_carga_extintores.xlsx');
  toast('Plantilla descargada.');
}

/* ---------- Lectura del Excel cargado ---------- */
const xNorm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
const xCode = s => xNorm(s).replace(/[\s\-_.\/]+/g, '');
function xCell(c) {
  let v = c && c.value;
  if (v == null) return '';
  if (v instanceof Date) return v;
  if (typeof v === 'object') {
    if (v.richText) return v.richText.map(t => t.text).join('');
    if ('result' in v) v = v.result;
    else if (v.text != null) return String(v.text);
    else if (v.error) return '';
    if (v instanceof Date) return v;
    if (v == null) return '';
  }
  return v;
}
const MESES = { ENE: 1, FEB: 2, MAR: 3, ABR: 4, MAY: 5, JUN: 6, JUL: 7, AGO: 8, SET: 9, SEP: 9, OCT: 10, NOV: 11, DIC: 12 };
/** Devuelve 'AAAA-MM-DD', '' si vacío o lanza error si no se reconoce */
function xParseDate(v) {
  const iso = (y, m, d) => {
    y = +y; m = +m; d = +d;
    if (y < 100) y += 2000;
    if (!(y >= 1980 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) throw new Error('fecha fuera de rango');
    const last = new Date(y, m, 0).getDate(); if (d > last) d = last;
    return y + '-' + pad(m) + '-' + pad(d);
  };
  if (v === '' || v == null) return '';
  if (v instanceof Date) return iso(v.getUTCFullYear(), v.getUTCMonth() + 1, v.getUTCDate());
  if (typeof v === 'number') {
    if (v >= 1980 && v <= 2100 && Number.isInteger(v)) return iso(v, 1, 1);
    if (v > 25000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    throw new Error('fecha no reconocida (' + v + ')');
  }
  const s = String(v).trim().toUpperCase();
  if (!s || s === '-' || s === '—' || s === 'N/A' || s === 'NA') return '';
  let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) return iso(m[3], m[2], m[1]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return iso(m[2], m[1], 1);
  if ((m = s.match(/^(\d{4})$/))) return iso(m[1], 1, 1);
  if ((m = s.match(/^([A-Z]{3})[A-Z]*[-\/.\s]+(\d{2,4})$/)) && MESES[m[1]]) return iso(m[2], MESES[m[1]], 1);
  if ((m = s.match(/^(\d{1,2})[-\/.\s]+([A-Z]{3})[A-Z]*[-\/.\s]+(\d{2,4})$/)) && MESES[m[2]]) return iso(m[3], MESES[m[2]], m[1]);
  throw new Error('fecha no reconocida ("' + String(v).slice(0, 20) + '")');
}
function xAgente(v) {
  const u = xNorm(v);
  if (!u) return '';
  if (/ACETATO|POTASIO|^K$|CLASE K|^K\b/.test(u)) return 'Acetato de Potasio';
  if (/CO2|CO 2|DIOXIDO|GAS CARB/.test(u)) return 'CO2';
  if (/PQS|POLVO|^ABC$|^BC$|QUIMICO SECO/.test(u)) return 'PQS';
  if (/AGUA/.test(u)) return 'Agua';
  if (/ESPUMA|AFFF/.test(u)) return 'Espuma';
  if (/HALOTRON|HALON|HCFC/.test(u)) return 'Halotron';
  return 'Otro';
}
function xCapacidad(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') return v + ' kg';
  const s = String(v).trim();
  if (/^\d+([.,]\d+)?$/.test(s)) return s.replace(',', '.') + ' kg';
  return s.replace(/(\d)\s*(KGS?|KILOS?|KILOGRAMOS?)\.?$/i, '$1 kg').replace(/(\d)\s*(LBS?|LIBRAS?)\.?$/i, '$1 lb');
}
const XLS_FIELDS = [
  ['fila', /^ITEM$|^N[º°O]?$/], ['serie', /SERIE/], ['codigo', /EXTINTOR|CODIGO/], ['empresa', /AREA|CONTRATISTA|EMPRESA/],
  ['ubicacion', /UBICACION/], ['agente', /^TIPO|AGENTE/], ['capacidad', /CAPACIDAD/], ['fecha_mant', /MANTENIMIENTO|RECARGA/],
  ['prox_ph', /HIDROSTATICA/], ['marca', /MARCA/], ['clase', /^CLASE$/]
];
function xDetect(ws) {
  for (let r = 1; r <= Math.min(20, ws.rowCount); r++) {
    const row = ws.getRow(r), map = {};
    let hasExt = false;
    row.eachCell({ includeEmpty: false }, (c, col) => {
      const t = xNorm(xCell(c)); if (!t || typeof t !== 'string') return;
      if (/EXTINTOR|CODIGO/.test(t) && !/SERIE/.test(t)) hasExt = true;
      for (const [k, re] of XLS_FIELDS) { if (map[k] == null && re.test(t)) { map[k] = { col: col, head: t }; break; } }
    });
    if (hasExt && map.codigo && Object.keys(map).length >= 4) return { row: r, map: map };
  }
  return null;
}

function xlsImportar() {
  modal(`<h3>Carga masiva de extintores</h3>
    <p class="sub" style="margin-top:0">Use el formato de registro de extintores (.xlsx). Cada fila crea un extintor nuevo o actualiza el que ya tenga el mismo Nº de extintor.${seesAll() ? '' : ' Todos se registran a nombre de <b>' + esc(empName(me().empresa_id)) + '</b>.'}</p>
    <button class="btn sec block" onclick="xlsPlantilla()">${ico('down')} Descargar plantilla vacía</button>
    <label class="btn block" style="margin-top:10px;color:var(--accent-ink)">${ico('xls')} Elegir archivo Excel<input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hide" onchange="xlsLeer(this.files[0])"></label>
    <div id="xi-msg" class="sub" style="margin-top:10px"></div>
    <button class="btn ghost block" style="margin-top:6px" onclick="closeModal()">Cancelar</button>`);
}

let XLS_ROWS = [];
async function xlsLeer(file) {
  if (!file) return;
  const msg = $('#xi-msg'); if (msg) msg.textContent = 'Leyendo ' + file.name + '…';
  try {
    if (/\.xls$/i.test(file.name)) throw new Error('El archivo es .xls (Excel antiguo). Ábralo en Excel y guárdelo como .xlsx.');
    await loadExcel();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let ws = wb.getWorksheet('FORMATO'), det = ws && xDetect(ws);
    if (!det) { for (const w of wb.worksheets) { const d = xDetect(w); if (d) { ws = w; det = d; break; } } }
    if (!det) throw new Error('No se encontró la fila de títulos (debe tener al menos "Nº EXTINTOR" y "NÚMERO DE SERIE"). Use la plantilla.');
    const M = det.map;
    if (!M.codigo) throw new Error('No se encontró la columna "Nº EXTINTOR".');
    const emps = S.data.empresas || [];
    const byCode = {}; (S.data.extintores || []).forEach(e => { if (e.estado !== 'Dado de Baja') byCode[xCode(e.codigo)] = e; });
    const ok = [], bad = [], seen = {};
    const get = (row, k) => M[k] ? xCell(row.getCell(M[k].col)) : '';
    for (let r = det.row + 1; r <= ws.rowCount; r++) {
      const row = ws.getRow(r);
      const codigoRaw = get(row, 'codigo');
      const codigo = String(codigoRaw instanceof Date ? '' : codigoRaw).replace(/\s+/g, ' ').trim().toUpperCase();
      if (codigo && xNorm(codigo) === M.codigo.head) continue;           // celdas combinadas del título
      const otros = ['serie', 'ubicacion', 'capacidad', 'marca'].filter(k => { const x = String(get(row, k)).trim(); return x && xNorm(x) !== (M[k] || {}).head; });
      if (!codigo) { if (otros.length) bad.push({ fila: r, codigo: '', error: 'Falta el Nº de extintor.' }); continue; }
      try {
        if (seen[xCode(codigo)]) throw new Error('Código repetido en el archivo (fila ' + seen[xCode(codigo)] + ').');
        seen[xCode(codigo)] = r;
        const item = { fila: r, codigo: codigo, serie: String(get(row, 'serie')).trim(), marca: String(get(row, 'marca')).trim(),
          ubicacion: String(get(row, 'ubicacion')).replace(/\s+/g, ' ').trim(), capacidad: xCapacidad(get(row, 'capacidad')),
          agente: xAgente(get(row, 'agente')), clase: String(get(row, 'clase')).trim().toUpperCase() };
        if (item.clase && CLASES.indexOf(item.clase) < 0) item.clase = '';
        try { item.fecha_mant = xParseDate(get(row, 'fecha_mant')); } catch (e) { throw new Error('Fecha de mantenimiento: ' + e.message); }
        try { item.prox_ph = xParseDate(get(row, 'prox_ph')); } catch (e) { throw new Error('Prueba hidrostática: ' + e.message); }
        const empTxt = String(get(row, 'empresa')).trim();
        if (seesAll()) {
          const prev = byCode[xCode(codigo)];
          const em = empTxt ? emps.find(x => xCode(x.nombre) === xCode(empTxt)) : null;
          if (empTxt && !em) throw new Error('Área / contratista "' + empTxt + '" no está registrada.');
          if (!em && !prev) throw new Error('Falta el área o contratista responsable.');
          item.empresa_id = em ? em.id : prev.empresa_id; item.empresa = em ? em.nombre : empName(prev.empresa_id);
        } else {
          item.empresa_id = me().empresa_id; item.empresa = empName(me().empresa_id);
          const prev = byCode[xCode(codigo)];
          if (prev && prev.empresa_id !== me().empresa_id) throw new Error('El código ya está registrado por otra empresa / área.');
        }
        item._existe = !!byCode[xCode(codigo)];
        ok.push(item);
      } catch (e) { bad.push({ fila: r, codigo: codigo, error: e.message }); }
    }
    if (!ok.length && !bad.length) throw new Error('El archivo no tiene extintores debajo de los títulos.');
    if (ok.length > 1500) throw new Error('Máximo 1500 extintores por carga. Divida el archivo.');
    XLS_ROWS = ok;
    xlsPreview(file.name, ok, bad);
  } catch (e) {
    if (msg) { msg.className = 'errbox'; msg.textContent = e.message; } else toast(e.message, 4000);
  }
}

function xlsPreview(name, ok, bad) {
  const nuevos = ok.filter(x => !x._existe).length, act = ok.length - nuevos;
  modal(`<h3>Revisar carga</h3>
    <p class="sub" style="margin-top:0">${esc(name)}</p>
    <div class="metrics" style="margin-bottom:12px;grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="metric" style="cursor:default"><div class="n num" style="color:var(--ok)">${nuevos}</div><div class="l">Nuevos</div></div>
      <div class="metric" style="cursor:default"><div class="n num" style="color:var(--accent)">${act}</div><div class="l">Se actualizan</div></div>
      <div class="metric" style="cursor:default"><div class="n num" style="color:${bad.length ? 'var(--bad)' : 'var(--ink)'}">${bad.length}</div><div class="l">Con error</div></div>
    </div>
    ${bad.length ? `<div class="errbox" style="max-height:170px;overflow:auto"><b>Filas que no se cargarán:</b><br>${bad.slice(0, 80).map(b => `Fila ${b.fila}${b.codigo ? ' (' + esc(b.codigo) + ')' : ''}: ${esc(b.error)}`).join('<br>')}${bad.length > 80 ? '<br>…' : ''}</div>` : ''}
    ${ok.length ? `<div style="overflow-x:auto;max-height:260px;border:1px solid var(--line);border-radius:10px"><table style="font-size:13px">
      <tr><th>Fila</th><th>Nº ext.</th><th>Área</th><th>Tipo</th><th>Cap.</th><th>Mant./recarga</th><th>Próx. PH</th><th></th></tr>
      ${ok.slice(0, 60).map(x => `<tr><td class="num">${x.fila}</td><td style="white-space:nowrap"><b>${esc(x.codigo)}</b></td><td>${esc(x.empresa)}</td><td>${esc(toTipo(x.agente) || '—')}</td><td>${esc(x.capacidad)}</td><td class="num">${fdate(x.fecha_mant)}</td><td class="num">${fdate(x.prox_ph)}</td><td>${x._existe ? '<span class="badge b-i">actualiza</span>' : '<span class="badge b-ok">nuevo</span>'}</td></tr>`).join('')}
    </table></div>${ok.length > 60 ? `<p class="sub">Mostrando 60 de ${ok.length}.</p>` : ''}` : ''}
    ${ok.length ? `<button class="btn block" style="margin-top:14px" id="xi-go" onclick="xlsEnviar()">${ico('up')} Cargar ${ok.length} extintor(es)</button>` : ''}
    <p class="sub">La carga necesita señal. Las celdas vacías no borran datos de los extintores que ya existen.</p>
    <button class="btn ghost block" onclick="closeModal()">Cancelar</button>`);
}

async function xlsEnviar() {
  const b = $('#xi-go'); if (b) { b.disabled = true; b.textContent = 'Cargando…'; }
  try {
    const rows = XLS_ROWS.map(x => { const o = Object.assign({}, x); delete o._existe; return o; });
    const r = await onlineOp('extintor.bulk', { rows: rows });
    const er = r.errores || [];
    modal(`<h3>Carga terminada</h3>
      <div class="okbox">${r.creados || 0} extintor(es) nuevo(s) · ${r.actualizados || 0} actualizado(s)</div>
      ${er.length ? `<div class="errbox" style="max-height:220px;overflow:auto"><b>${er.length} fila(s) rechazada(s) por el servidor:</b><br>${er.map(x => `Fila ${esc(x.fila)} (${esc(x.codigo)}): ${esc(x.error)}`).join('<br>')}</div>` : ''}
      <button class="btn block" onclick="closeModal();S.filters={q:'',emp:'',sem:'',est:''};go('#/extintores');viewList()">Ver extintores</button>`);
    XLS_ROWS = [];
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = 'Reintentar carga'; }
    toast(e.offline ? 'Sin señal. La carga masiva necesita conexión.' : e.message, 4500);
  }
}

/* ============================ Modal, imágenes ============================ */
let MODAL_CLOSE = null;
function modal(html, onClose) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener('click', ev => { if (ev.target === m) closeModal(); });
  document.body.appendChild(m); MODAL_CLOSE = onClose || null;
}
function closeModal() { const m = document.querySelector('.modal'); if (m) m.remove(); if (MODAL_CLOSE) { MODAL_CLOSE(); MODAL_CLOSE = null; } }

function compressImage(file, max) {
  max = max || 1024;
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => rej(new Error('No se pudo leer la imagen.'));
    img.src = url;
  });
}
function fileToB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

/* ============================ Inicio ============================ */
(async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try {
    S.session = await DB.get('session') || null;
    S.data = await DB.get('data') || null;
    S.queue = await DB.get('queue') || [];
    S.lastSync = await DB.get('lastSync') || null;
  } catch (e) { console.warn(e); }
  route();
  if (S.session) {
    try { if (S.queue.length) await trySync(); else await refresh(true); }
    catch (e) { if (!S.data) $('#app').innerHTML = '<div class="empty" style="margin-top:25vh">Sin conexión y sin datos guardados.<br>Abra la app con señal la primera vez.<br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>'; }
  }
  window.addEventListener('online', () => trySync());
  setInterval(() => { if (S.queue.some(o => !o.error)) trySync(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.queue.some(o => !o.error)) trySync(); });
})();
</script>
